<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrato de corretaje inmobiliario</title>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.3.0/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.71.1/build/docxtemplater.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#222}
h1{font-size:1.3rem}h2{font-size:1.05rem;margin:22px 0 4px;border-bottom:1px solid #ccc}
label{display:block;margin:10px 0 2px;font-size:.9rem}
input,select{width:100%;padding:9px;font-size:1rem;box-sizing:border-box;margin-bottom:2px}
button{padding:11px 16px;font-size:1rem;margin:12px 8px 0 0;cursor:pointer}
#out{margin-top:24px;padding:16px;border:1px solid #ccc;text-align:justify;font-size:.95rem}
.hid{display:none}#st{margin-top:10px;font-weight:bold}
@media print{.no-print{display:none}#out{border:0}}
</style></head><body>
<div class="no-print">
<h1>Contrato de corretaje inmobiliario</h1>
<p>Complete los datos y se descargará el contrato en Word, listo para revisar y firmar.</p>
<form id="f"></form><div id="st"></div></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwqqJLRWDPOtkgsfWM-s6STMw-efvCky0x_ZYzU-3JGlyCiJX9mBCz9MK6WCUX2iPWG0w/exec'; 
const MUN=['Cartagena del Chairá','Puerto Rico','San Vicente del Caguán','Florencia','Albania','Belén de los Andaquíes','Curillo','El Doncello','El Paujil','La Montañita','Milán','Morelia','San José del Fragua','Solano','Solita','Valparaíso'];
const F=[
['sec','Propietario'],
['nombre','Nombre completo','text'],
['sexo','Sexo','sel',['Mujer','Hombre']],
['cedula','Cédula de ciudadanía N.º','text'],
['domicilio','Municipio de domicilio','mun'],
['calidad','¿Actúa en nombre propio o en representación de una empresa?','sel',['En nombre propio','En representación de una empresa']],
['empresa','Razón social de la empresa','text','','emp'],
['nit','NIT de la empresa','text','','emp'],
['dir','Dirección de notificación','text'],
['tel','Teléfono / WhatsApp','text'],
['email','Correo electrónico','email'],
['sec','Inmueble'],
['tipo','Tipo de inmueble','sel',['casa','lote urbano','lote rural','apartamento','local comercial','finca']],
['ubic','Ubicación (dirección, barrio o vereda)','text'],
['muni_inm','Municipio del inmueble','mun'],
['area','Área aproximada y medidas','text'],
['matricula','Matrícula inmobiliaria N.º','text'],
['catastral','Cédula catastral N.º','text'],
['grav','Embargos o gravámenes (opcional; vacío = ninguno)','text'],
['sec','Condiciones'],
['precio','Precio mínimo de venta (COP)','number'],
['pct','Comisión (%)','number','5'],
['dias','Días hábiles para pagos y reportes','number','3'],
['prot','Días de protección posterior a la terminación','number','90'],
['sede','Sede del tribunal de arbitramento','sel',['del domicilio de [P]','del lugar donde se encuentra EL INMUEBLE']],
['sec','Corredor'],
['cnombre','Nombre del corredor','text','Brandon Alvis'],
['cced','Cédula del corredor','text','1.075.314.206 expedida en Neiva, Huila'],
['cdom','Domicilio del corredor','text','Cartagena del Chairá, Caquetá'],
['ccargo','Cargo','text','director comercial'],
['cemp','Empresa','text','ING3DRECO SAS'],
['cnit','NIT','text','901580047-1'],
['cdir','Dirección de notificación del corredor','text',''],
['ctel','Teléfono del corredor','text',''],
['cemail','Correo del corredor','email',''],
['sec','Firma'],
['lugar','Municipio de firma','mun'],
['fecha','Fecha','date']
];
const $=i=>document.getElementById(i),f=$('f');
const optional=l=>/opcional/.test(l);
f.innerHTML=F.map(([id,l,t,o,g])=>{
 if(id==='sec')return `<h2>${l}</h2>`;
 const r=optional(l)||g||['cdir','ctel','cemail'].includes(id)?'':'required';
 let c;
 if(t==='sel')c=`<select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
 else if(t==='mun')c=`<select id="${id}" data-m="1">${MUN.map(x=>`<option>${x}</option>`).join('')}<option value="__o">Otro (escribir)</option></select><input id="${id}_o" class="hid" placeholder="Municipio, Departamento">`;
 else c=`<input id="${id}" type="${t}" value="${o||''}" ${r}>`;
 return `<div class="${g||''} ${g?'hid':''}"><label>${l}</label>${c}</div>`}).join('')+'<button type="submit">Generar contrato</button>';
$('fecha').value=new Date().toISOString().slice(0,10);
document.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>$(s.id+'_o').classList.toggle('hid',s.value!=='__o'));
$('calidad').onchange=()=>{const e=$('calidad').selectedIndex==1;document.querySelectorAll('.emp').forEach(x=>{x.classList.toggle('hid',!e);x.querySelector('input').required=e})};
const v=id=>{const s=$(id);return s.dataset.m?(s.value==='__o'?$(id+'_o').value.trim():s.value+', Caquetá'):s.value.trim()};
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function n2w(n){const u=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'],t=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'],c=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
 const h=x=>{if(x==100)return'CIEN';let r=x%100,s=c[x/100|0]+' '+(r<30?u[r]:t[r/10|0]+(r%10?' Y '+u[r%10]:''));return s.trim()};
 const m=Math.floor(n/1e6)%1000,k=Math.floor(n/1e3)%1000,r=n%1000;let s='';
 if(m)s+=(m==1?'UN MILLÓN':h(m)+' MILLONES')+' ';if(k)s+=(k==1?'MIL':h(k)+' MIL')+' ';if(r)s+=h(r);
 s=s.trim().replace(/VEINTIUNO (MIL|MILLONES)/,'VEINTIÚN $1');
 return s+((k||r)?' PESOS':' DE PESOS')}

function buildVars(d){
 const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
 const mujer=d.sexo==='Mujer',emp=d.calidad.startsWith('En rep'),EP=(emp||mujer)?'LA PROPIETARIA':'EL PROPIETARIO';
 return {consecutivo:d.consecutivo,lugar:d.lugar,dia:String(+d.fecha.slice(8)),mes:M[+d.fecha.slice(5,7)-1],anio:d.fecha.slice(0,4),
  EP,identificado:mujer?'identificada':'identificado',obligado:EP==='LA PROPIETARIA'?'obligada':'obligado',
  nombre:d.nombre,nombre_mayus:d.nombre.toUpperCase(),cedula:d.cedula,domicilio:d.domicilio,
  empresa:emp,empresa_nombre:d.empresa,nit:d.nit,
  cnombre:d.cnombre,cnombre_mayus:d.cnombre.toUpperCase(),cced:d.cced,cdom:d.cdom,ccargo:d.ccargo,cemp:d.cemp,cnit:d.cnit,
  tipo:d.tipo,ubic:d.ubic,muni_inm:d.muni_inm,area:d.area,matricula:d.matricula,catastral:d.catastral||'N/A',grav:d.grav||'ninguna',
  precio:Number(d.precio).toLocaleString('es-CO'),precio_letras:n2w(+d.precio),pct:d.pct,dias:d.dias,prot:d.prot,
  sede:d.sede.replace('[P]',EP),dir:d.dir,email:d.email,tel:d.tel,
  ccontacto:[d.cdir,d.cemail,d.ctel].filter(Boolean).join(', ')||d.cdom};
}
f.onsubmit=async ev=>{ev.preventDefault();const st=$('st');st.textContent='Generando…';
 const d={};F.forEach(([id])=>{if(id!=='sec')d[id]=v(id)});
 const n=new Date(),p=x=>String(x).padStart(2,'0');
 d.consecutivo=`CC-${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}`;
 try{
  const r=await fetch('plantilla_contrato.docx?'+Date.now());if(!r.ok)throw new Error('No se encontró plantilla_contrato.docx en el repositorio');
  const doc=new docxtemplater(new PizZip(await r.arrayBuffer()),{paragraphLoop:true,linebreaks:true,nullGetter:()=>''});
  doc.render(buildVars(d));
  const fname=('Contrato '+d.nombre+' - '+d.muni_inm.split(',')[0]).replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim()+'.docx';
  const z=doc.getZip(),mime='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const a=document.createElement('a');a.href=URL.createObjectURL(z.generate({type:'blob',mimeType:mime}));a.download=fname;a.click();
  const show=m=>st.innerHTML=m+` <a href="${a.href}" download="${a.download}">Descargar de nuevo (${a.download})</a>`;
  show('Contrato generado y descargado.');
  if(!SCRIPT_URL){show('Contrato generado y descargado (sin guardar en Drive: falta configurar SCRIPT_URL).');return}
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({datos:d,nombre:fname,archivo:z.generate({type:'base64'})})});
  show('Contrato generado, descargado y guardado en Drive.');
 }catch(x){st.textContent='Error: '+(x.properties&&x.properties.errors?x.properties.errors.map(y=>y.properties.explanation).join(' | '):x.message)}};
</script></body></html>
